[build]
  publish = "."
  functions = "netlify/functions"

# 站点根路径提供应用入口（仓库无 index.html，回退到主页面）
[[redirects]]
  from = "/"
  to = "/todo-calendar-v6.html"
  status = 200

# 把 /api/sync 映射到 Netlify Function，前端用相对路径调用
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200
  force = true
